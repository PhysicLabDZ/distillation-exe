const $=id=>document.getElementById(id),cv=$('c');cv.width=1672;cv.height=941;const g=cv.getContext('2d');
const rnd=(a,b)=>a+Math.random()*(b-a),clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
function rr(x,y,w,h,r){g.beginPath();g.moveTo(x+r,y);g.arcTo(x+w,y,x+w,y+h,r);g.arcTo(x+w,y+h,x,y+h,r);g.arcTo(x,y+h,x,y,r);g.arcTo(x,y,x+w,y,r);g.closePath()}
function lin(x0,y0,x1,y1,st){const q=g.createLinearGradient(x0,y0,x1,y1);st.forEach(s=>q.addColorStop(s[0],s[1]));return q}
function mk(p){const c=[0];for(let i=1;i<p.length;i++)c.push(c[i-1]+Math.hypot(p[i][0]-p[i-1][0],p[i][1]-p[i-1][1]));return{p,c,len:c[c.length-1]}}
function at(q,s){s=clamp(s,0,q.len);let i=1;while(i<q.c.length-1&&q.c[i]<s)i++;const k=(s-q.c[i-1])/(q.c[i]-q.c[i-1]||1);return[q.p[i-1][0]+(q.p[i][0]-q.p[i-1][0])*k,q.p[i-1][1]+(q.p[i][1]-q.p[i-1][1])*k]}
function smooth(p){const o=[p[0]];for(let i=1;i<p.length-1;i++){const m0=i==1?p[0]:[(p[i-1][0]+p[i][0])/2,(p[i-1][1]+p[i][1])/2],m1=[(p[i][0]+p[i+1][0])/2,(p[i][1]+p[i+1][1])/2];for(let k=1;k<=8;k++){const t=k/8,a=(1-t)*(1-t),b=2*(1-t)*t,c=t*t;o.push([a*m0[0]+b*p[i][0]+c*m1[0],a*m0[1]+b*p[i][1]+c*m1[1]])}}o.push(p[p.length-1]);return o}

/* ---------- geometry (from the photo) ---------- */
const A={x:688,y:275},ang=Math.atan(.2205),CA=Math.cos(ang),SA=Math.sin(ang),L=539,LAM=33,AMP=22;
const cw=(u,v)=>[A.x+u*CA-v*SA,A.y+u*SA+v*CA];
function coilPts(u0,u1,ramp){const p=[];for(let u=u0;u<=u1;u+=4)p.push(cw(u,AMP*Math.min(1,(u-u0+1)/ramp)*Math.sin(2*Math.PI*u/LAM)));return p}
const QS=mk([[441,300],[441,242],[462,233],[505,236],[560,248],[630,262]].concat(coilPts(0,L-60,50)));
const QB=mk(coilPts(95,L-45,1).concat([[1214,394],[1262,411],[1305,432],[1337,462],[1356,497],[1361,532],[1361,572]]));
const HA=smooth([[1012,711],[985,712],[960,702],[950,672],[964,628],[1008,592],[1066,563],[1100,548],[1108,538]]);
const HB=smooth([[708,432],[706,470],[722,528],[766,598],[826,664],[888,720],[934,762],[972,786],[1012,780]]);
const QHA=mk(HA),QHB=mk(HB);
const CX=446,CY=380,MINW=20,SX=441,PW=400,HL=1.2,CW=4.186;
let burner=false,paused=false,T=22,vol=0,water=200,time=0,ev=0,pend=0,flow=0,fk=0,speed=2,showL=true,snd=true,hist=[],hs=0,t2=0,sp=0,bs=0;
let bubbles=[],steam=[],beads=[],splash=[],ripples=[],wbA=[],wbB=[],jb=[],specks=[];
const sY=()=>458-(18+water/200*80);
const csY=()=>Math.max(700,868-vol*.55);
const streamEnd=()=>vol>.2?csY():866;
const evap=()=>clamp((200-water)/180,0,1);
const BP=()=>100.3+2.4*Math.pow(evap(),1.2)+.04*Math.sin(time*2.1);
const boiling=()=>burner&&T>=BP()-.7&&water>MINW;
const IMG=new Image();
function initParts(){
 wbA=[];wbB=[];jb=[];specks=[];
 for(let i=0;i<16;i++){wbA.push({s:rnd(0,QHA.len),v:rnd(55,115),off:rnd(-3.5,3.5),r:rnd(.9,2.6)});wbB.push({s:rnd(0,QHB.len),v:rnd(55,115),off:rnd(-3.5,3.5),r:rnd(.9,2.6)})}
 for(let i=0;i<22;i++)jb.push({u:rnd(0,L),v:rnd(-31,31),r:rnd(.6,1.5),sp:rnd(60,120),ph:rnd(0,6)});
 for(let i=0;i<42;i++)specks.push({x:CX+rnd(-78,78),y:rnd(sY()+8,452),r:rnd(.7,2)});
}

/* ---------- zoom / pan (wheel, keyboard, pinch, drag) ---------- */
var Z=1,PX=0,PY=0,ZW=1672,ZH=941,ZL=0,ZT=0,ZP=false;const ZMAX=6;
function zApply(){Z=clamp(Z,1,ZMAX);if(Z<=1.0001){Z=1;PX=0;PY=0}else{PX=clamp(PX,ZW*(1-Z),0);PY=clamp(PY,ZH*(1-Z),0)}cv.style.transform=Z===1?'none':'translate('+PX+'px,'+PY+'px) scale('+Z+')'}
function zLocal(cx,cy){return ZP?[cy-ZT,ZL-cx]:[cx-ZL,cy-ZT]}
function zAt(nz,lx,ly){nz=clamp(nz,1,ZMAX);const k=nz/Z;PX=lx-k*(lx-PX);PY=ly-k*(ly-PY);Z=nz;zApply()}
(function(){
 const ptr=new Map();let ld=0,lc=null;
 const info=()=>{const a=[...ptr.values()];if(a.length<2)return null;const d=Math.hypot(a[0][0]-a[1][0],a[0][1]-a[1][1]),c=zLocal((a[0][0]+a[1][0])/2,(a[0][1]+a[1][1])/2);return{d,c}};
 addEventListener('pointerdown',e=>{if(e.target.closest&&e.target.closest('#ui'))return;ptr.set(e.pointerId,[e.clientX,e.clientY]);const i=info();if(i){ld=i.d;lc=i.c}},{passive:true});
 addEventListener('pointermove',e=>{if(!ptr.has(e.pointerId))return;const o=ptr.get(e.pointerId);ptr.set(e.pointerId,[e.clientX,e.clientY]);
  if(ptr.size>=2){const i=info();if(i&&ld>0){zAt(Z*i.d/ld,i.c[0],i.c[1]);PX+=i.c[0]-lc[0];PY+=i.c[1]-lc[1];zApply();ld=i.d;lc=i.c}}
  else if(Z>1){const a=zLocal(o[0],o[1]),b=zLocal(e.clientX,e.clientY);PX+=b[0]-a[0];PY+=b[1]-a[1];zApply()}});
 const up=e=>{ptr.delete(e.pointerId);const i=info();if(i){ld=i.d;lc=i.c}};
 addEventListener('pointerup',up);addEventListener('pointercancel',up);
 addEventListener('wheel',e=>{e.preventDefault();const f=Math.exp(-e.deltaY*(e.deltaMode===1?.05:.0015)*(e.ctrlKey?2.5:1)),l=zLocal(e.clientX,e.clientY);zAt(Z*f,l[0],l[1])},{passive:false});
 addEventListener('keydown',e=>{if(e.ctrlKey||e.metaKey||e.altKey)return;const k=e.key;
  if(k==='+'||k==='='||k==='Add'){zAt(Z*1.25,ZW/2,ZH/2);e.preventDefault()}
  else if(k==='-'||k==='_'||k==='Subtract'){zAt(Z/1.25,ZW/2,ZH/2);e.preventDefault()}
  else if(k==='0'){Z=1;zApply();e.preventDefault()}});
})();

/* ---------- layout: landscape, forced rotation on portrait ---------- */
function fit(){const vw=innerWidth,vh=innerHeight,st=$('stage'),por=vh>vw,aw=por?vh:vw,ah=por?vw:vh,s=Math.min(aw/1672,ah/941),W=1672*s,H=941*s;
 st.style.width=W+'px';st.style.height=H+'px';
 if(por){st.style.left=(vw+H)/2+'px';st.style.top=(vh-W)/2+'px';st.style.transform='rotate(90deg)'}
 else{st.style.left=(vw-W)/2+'px';st.style.top=(vh-H)/2+'px';st.style.transform='none'}
 ZW=W;ZH=H;ZP=por;ZL=por?(vw+H)/2:(vw-W)/2;ZT=por?(vh-W)/2:(vh-H)/2;zApply()}
addEventListener('resize',fit);addEventListener('orientationchange',()=>setTimeout(fit,200));fit();
function goFull(){try{const e=document.documentElement;(e.requestFullscreen?e.requestFullscreen():Promise.resolve()).then(()=>screen.orientation&&screen.orientation.lock&&screen.orientation.lock('landscape')).catch(()=>{})}catch(e){}}

/* ---------- sound (WebAudio, synthesized) ---------- */
let AC=null,master,flameG,flameF,hissG,streamG,waterG,wBuf=null,wSrc=null,lastMG=-1;
function initAudio(){
 if(AC){if(AC.state==='suspended')AC.resume();return}
 try{AC=new(window.AudioContext||window.webkitAudioContext)()}catch(e){return}
 master=AC.createGain();master.connect(AC.destination);
 const n=AC.sampleRate*2,br=AC.createBuffer(1,n,AC.sampleRate),wh=AC.createBuffer(1,n,AC.sampleRate),d=br.getChannelData(0),w=wh.getChannelData(0);let b=0;
 for(let i=0;i<n;i++){const r=Math.random()*2-1;b=(b+.02*r)/1.02;d[i]=b*3.5;w[i]=r}
 const s1=AC.createBufferSource();s1.buffer=br;s1.loop=true;flameF=AC.createBiquadFilter();flameF.type='lowpass';flameF.frequency.value=380;flameG=AC.createGain();flameG.gain.value=0;s1.connect(flameF);flameF.connect(flameG);flameG.connect(master);s1.start();
 const s2=AC.createBufferSource();s2.buffer=wh;s2.loop=true;const hp=AC.createBiquadFilter();hp.type='highpass';hp.frequency.value=3000;hissG=AC.createGain();hissG.gain.value=0;s2.connect(hp);hp.connect(hissG);hissG.connect(master);s2.start();
 const s3=AC.createBufferSource();s3.buffer=wh;s3.loop=true;const bp=AC.createBiquadFilter();bp.type='bandpass';bp.frequency.value=1900;bp.Q.value=.7;streamG=AC.createGain();streamG.gain.value=0;s3.connect(bp);bp.connect(streamG);streamG.connect(master);s3.start();
 waterG=AC.createGain();waterG.gain.value=0;waterG.connect(master);loadWater();
 AC.noiseW=wh;
}
